<app-user-nav></app-user-nav>


<!-- =====================================================
     FULL SCREEN LOADING SCREEN
====================================================== -->

<div
  class="portfolio-loader"
  *ngIf="isLoading"

  (wheel)="$event.preventDefault()"

  (touchmove)="$event.preventDefault()"

  (click)="$event.stopPropagation()"
>


  <!-- Animated background particles -->

  <div class="loader-particles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

  </div>


  <!-- =================================================
       LOADER CARD
  ================================================== -->

  <div class="loader-card">


    <!-- Top accent -->

    <div class="card-top-line"></div>


    <!-- =================================================
         ANIMATION
    ================================================== -->

    <div class="loader-animation">


      <!-- Outer rotating ring -->

      <div class="loader-ring outer"></div>


      <!-- Middle rotating ring -->

      <div class="loader-ring middle"></div>


      <!-- Inner rotating ring -->

      <div class="loader-ring inner"></div>


      <!-- Center -->

      <div class="loader-center">

        <span class="code-symbol">
          &lt;/&gt;
        </span>

      </div>


    </div>


    <!-- =================================================
         CONTENT
    ================================================== -->

    <div class="loader-content">


      <!-- Status -->

      <div class="loader-status">

        <span class="status-dot"></span>

        <span>
          SYSTEM INITIALIZING
        </span>

      </div>


      <!-- Heading -->

      <h1>

        Loading Portfolio

      </h1>


      <!-- Description -->

      <p class="loader-description">

        Preparing my full-stack portfolio

        <span class="dots">

          <span>.</span>
          <span>.</span>
          <span>.</span>

        </span>

      </p>


      <!-- Technology stack -->

      <div class="loader-tech-stack">


        <span class="tech angular">
          Angular
        </span>


        <span class="tech-separator">
          •
        </span>


        <span class="tech spring">
          Spring Boot
        </span>


        <span class="tech-separator">
          •
        </span>


        <span class="tech sql">
          SQL Server
        </span>


        <span class="tech-separator">
          •
        </span>


        <span class="tech java">
          Java
        </span>


      </div>


      <!-- Information -->

      <div class="loader-message">

        <span class="message-icon">
          ⚡
        </span>

        <span>
          Connecting to backend services
        </span>

      </div>


      <!-- =================================================
           PROGRESS
      ================================================== -->

      <div class="loading-progress">


        <div class="progress-track">

          <div class="progress-bar"></div>

        </div>


        <div class="progress-info">

          <span>
            INITIALIZING
          </span>

          <span>
            0% — 100%
          </span>

        </div>


      </div>


      <!-- =================================================
           READY / CONTINUE
      ================================================== -->

      <div
        class="continue-container"

        *ngIf="showContinueButton"
      >


        <!-- Ready message -->

        <div class="ready-message">

          <span class="ready-icon">
            ✓
          </span>

          <span>
            Portfolio Ready
          </span>

        </div>


        <!-- Main button -->

        <button
          type="button"

          class="continue-button"

          (click)="goToContent()"
        >

          <span class="button-icon">
            🚀
          </span>


          <span class="button-text">
            Click Here to Explore
          </span>


          <span class="arrow">
            →
          </span>

        </button>


        <!-- Hint -->

        <span class="continue-hint">

          Enter the portfolio experience

        </span>


      </div>


    </div>


  </div>


</div>



<!-- =====================================================
     PORTFOLIO CONTENT
====================================================== -->

<main
  class="portfolio"

  [class.content-loaded]="!isLoading"
>


  <!-- =================================================
       PROFILE
  ================================================== -->

  <section
    id="profile"

    class="portfolio-section"
  >

    <app-user-profile></app-user-profile>

  </section>


  <!-- =================================================
       SKILLS
  ================================================== -->

  <section
    id="skills"

    class="portfolio-section"
  >

    <app-skills></app-skills>

  </section>


  <!-- =================================================
       EXPERIENCE
  ================================================== -->

  <section
    id="experience"

    class="portfolio-section"
  >

    <app-user-experience></app-user-experience>

  </section>


  <!-- =================================================
       PROJECTS
  ================================================== -->

  <section
    id="projects"

    class="portfolio-section"
  >

    <app-user-projects></app-user-projects>

  </section>


  <!-- =================================================
       EDUCATION
  ================================================== -->

  <section
    id="education"

    class="portfolio-section"
  >

    <app-user-education></app-user-education>

  </section>


</main>

<app-user-nav></app-user-nav>

<div
  class="portfolio-loader"
  *ngIf="isLoading"
  (wheel)="$event.preventDefault()"
  (touchmove)="$event.preventDefault()"
  (click)="$event.stopPropagation()"
>
  <div class="loader-card">

    <div class="loader-animation">
      <div class="loader-ring"></div>
      <div class="loader-ring inner"></div>
      <div class="loader-icon">&lt;/&gt;</div>
    </div>

    <div class="loader-content">

      <span class="loader-status">
        <span class="status-dot"></span>
        INITIALIZING FULL-STACK APP
      </span>

      <h2>Loading Portfolio</h2>

      <p>
        Fetching data from backend
        <span class="dots">
          <span>.</span>
          <span>.</span>
          <span>.</span>
        </span>
      </p>

      <div class="loader-info">
        <span>Angular</span>
        <span>•</span>
        <span>Spring Boot</span>
        <span>•</span>
        <span>SQL Server</span>
      </div>

      <small>
        This is a full-stack portfolio.
        Please wait while the backend prepares your data.
      </small>

      <div class="loading-progress">
        <div class="progress-bar"></div>
      </div>

      <div class="loading-status">
        <span class="pulse-circle"></span>
        Connecting to backend services...
      </div>

    </div>

  </div>
</div>


<main
  class="portfolio"
  [class.content-loaded]="!isLoading"
>

  <section id="profile" class="portfolio-section">

    <app-user-profile
      (loaded)="onSectionLoaded('profile')">
    </app-user-profile>

  </section>


  <section id="skills" class="portfolio-section">

    <app-skills
      (loaded)="onSectionLoaded('skills')">
    </app-skills>

  </section>


  <section id="experience" class="portfolio-section">

    <app-user-experience
      (loaded)="onSectionLoaded('experience')">
    </app-user-experience>

  </section>


  <section id="projects" class="portfolio-section">

    <app-user-projects
      (loaded)="onSectionLoaded('projects')">
    </app-user-projects>

  </section>


  <section id="education" class="portfolio-section">

    <app-user-education
      (loaded)="onSectionLoaded('education')">
    </app-user-education>

  </section>

</main>

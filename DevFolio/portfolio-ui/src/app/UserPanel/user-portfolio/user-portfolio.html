<!-- ================= LOADING SCREEN ================= -->

<div
  class="loader-overlay"
  *ngIf="isLoading"
  (click)="$event.stopPropagation()">

  <div class="loader-bg-shape shape-one"></div>
  <div class="loader-bg-shape shape-two"></div>
  <div class="loader-bg-shape shape-three"></div>

  <div class="loader-card">

    <!-- Developer Icon -->
    <div class="loader-icon-wrapper">
      <div class="loader-icon">
        <i class="bi bi-code-slash"></i>
      </div>
    </div>

    <!-- Title -->
    <h1 class="loader-title">
      Welcome to My Portfolio
    </h1>

    <!-- Loading Message -->
    <p class="loader-description" *ngIf="!showContinueButton">
      Preparing my portfolio...
    </p>

    <!-- Ready Message -->
    <p class="loader-description ready-message" *ngIf="showContinueButton">
      Portfolio is ready. Let's explore!
    </p>

    <!-- Technology Pills -->
    <div class="tech-stack">
      <span class="tech-pill angular">
        <i class="bi bi-code-square"></i>
        Angular
      </span>

      <span class="tech-pill java">
        <i class="bi bi-cup-hot"></i>
        Java
      </span>

      <span class="tech-pill spring">
        <i class="bi bi-leaf"></i>
        Spring Boot
      </span>

      <span class="tech-pill database">
        <i class="bi bi-database"></i>
        SQL
      </span>
    </div>

    <!-- Progress -->
    <div class="loader-progress">
      <div
        class="progress-bar"
        [class.progress-complete]="showContinueButton">
      </div>
    </div>

    <!-- Loading Status -->
    <div class="loader-status" *ngIf="!showContinueButton">
      <span class="status-dot"></span>
      <span>Loading portfolio...</span>
    </div>

    <!-- Continue Button -->
    <div
      class="continue-container"
      *ngIf="showContinueButton">

      <div class="ready-badge">
        <i class="bi bi-check-circle-fill"></i>
        Portfolio Ready
      </div>

      <button
        type="button"
        class="continue-btn"
        (click)="goToContent()">

        <span>Explore My Portfolio</span>

        <i class="bi bi-arrow-right"></i>

      </button>

      <small>
        Click to continue
      </small>

    </div>

  </div>

</div>


<!-- ================= PORTFOLIO ================= -->

<div class="portfolio">

  <app-user-nav></app-user-nav>

  <main>

    <!-- Profile -->
    <section
      id="profile"
      class="portfolio-section">

      <app-user-profile></app-user-profile>

    </section>


    <!-- Skills -->
    <section
      id="skills"
      class="portfolio-section">

      <app-skills></app-skills>

    </section>


    <!-- Experience -->
    <section
      id="experience"
      class="portfolio-section">

      <app-user-experience></app-user-experience>

    </section>


    <!-- Projects -->
    <section
      id="projects"
      class="portfolio-section">

      <app-user-projects></app-user-projects>

    </section>


    <!-- Education -->
    <section
      id="education"
      class="portfolio-section">

      <app-user-education></app-user-education>

    </section>

  </main>

</div>
